<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tschaikowsky für Kinder</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--n:#16304f;--g:#1f6b45;--r:#b8232f;--y:#f2b84b;--p:#fffdf8}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:21px/1.55 Fredoka,"Trebuchet MS",Verdana,sans-serif;color:#1d2433;background:#e8f2fa;min-height:100vh}
header{background:var(--n);color:#fff;text-align:center;padding:14px 12px 24px;position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:radial-gradient(circle,var(--y) 4px,transparent 5px) 0 0/32px 12px,radial-gradient(circle,#e8505b 4px,transparent 5px) 16px 0/32px 12px,radial-gradient(circle,#5fbf8a 4px,transparent 5px) 8px 0/32px 12px}
h1{margin:0;font-size:1.5rem}
main{max-width:760px;margin:0 auto;padding:20px 14px 60px}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--y);outline-offset:2px}
#back{position:absolute;left:10px;top:10px;background:#fff;border:0;border-radius:20px;padding:4px 14px;color:var(--n)}
.menu{display:grid;gap:14px;margin-top:18px}
.menu button{display:flex;align-items:center;gap:16px;border:0;border-radius:28px 12px 28px 12px;padding:16px 20px;color:#fff;text-align:left;font-size:1.35rem;font-weight:600;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.menu button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.menu span{font-size:2.6rem}.menu small{display:block;font-weight:400;font-size:.9rem;opacity:.9}
.c{position:relative;display:flex;gap:16px;align-items:flex-start;background:var(--p);border-radius:22px;border-left:10px solid var(--r);padding:16px 62px 16px 16px;margin:0 0 16px;box-shadow:0 3px 8px rgba(22,48,79,.15)}
.c:nth-of-type(3n+2){border-color:var(--g)}.c:nth-of-type(3n){border-color:var(--y)}
.pic{flex:none;width:84px;height:84px;border-radius:50%;background:#dff0e6;display:grid;place-items:center;font-size:2.8rem}
.pic svg{width:76px;height:86px}
h3{margin:0 0 4px;font-size:1.4rem;color:var(--r)}p{margin:0 0 8px}
.snd{position:absolute;right:10px;top:10px;width:46px;height:46px;border-radius:50%;border:3px solid var(--g);background:#fff;font-size:1.3rem}
.pl{margin:4px 6px 4px 0;border:0;border-radius:20px;background:var(--g);color:#fff;padding:6px 16px}
#t{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--n);color:#fff;padding:10px 18px;border-radius:16px;max-width:90%;z-index:9}
#snow span{position:fixed;top:-30px;color:#fff;opacity:.8;pointer-events:none;animation:f linear infinite;z-index:5}
@keyframes f{to{transform:translateY(110vh) rotate(180deg)}}
@media(prefers-reduced-motion:reduce){#snow{display:none}}
@media(max-width:480px){.c{flex-direction:column;padding-right:16px;padding-top:60px}.pic{width:70px;height:70px}}
</style></head><body>
<div id="snow" aria-hidden="true"></div>
<header><button id="back" data-go="home" hidden>⬅ Zurück</button><h1>🎄 Tschaikowsky für Kinder 🎄</h1></header>
<main id="m"></main><div id="t" hidden></div>
<svg width="0" height="0" style="position:absolute"><symbol id="pt" viewBox="0 0 100 112">
<path d="M12 112c0-26 16-36 38-36s38 10 38 36z" fill="#2f3a5a"/><path d="M50 86l-11-7v13zM50 86l11-7v13z" fill="#b8232f"/>
<circle cx="50" cy="48" r="25" fill="#ffd9b8"/><path d="M25 48c-1-20 10-27 25-27s26 7 25 27c-4-9-10-13-25-13s-21 4-25 13z" fill="#e9e9f0"/>
<path d="M26 52c1 22 14 32 24 32s23-10 24-32c-6 8-13 11-24 11s-18-3-24-11z" fill="#e9e9f0"/>
<circle cx="40" cy="47" r="3" fill="#222"/><circle cx="60" cy="47" r="3" fill="#222"/>
<circle cx="34" cy="56" r="4" fill="#f4a3a3" opacity=".6"/><circle cx="66" cy="56" r="4" fill="#f4a3a3" opacity=".6"/>
<path d="M42 64q8 7 16 0" stroke="#8a3d2f" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M24 30C26 12 44 4 58 8c10 3 16 12 18 22z" fill="#c4252f"/><rect x="22" y="26" width="56" height="9" rx="4.5" fill="#fff"/><circle cx="62" cy="7" r="6" fill="#fff"/></symbol></svg>
<script>
const S=speechSynthesis,$=s=>document.querySelector(s),PT='<svg><use href="#pt"/></svg>';
const card=(e,t,x,b='')=>`<article class="c"><div class="pic">${e}</div><div><h3>${t}</h3><p>${x}</p>${b}</div><button class="snd" title="Vorlesen" aria-label="Vorlesen">🔊</button></article>`;
const pl=(f,t)=>`<button class="pl" data-f="${f}">▶ ${t}</button>`;
const L=[['🎹','1844','Peter ist erst 4 Jahre alt. Er hört gern Musik und möchte Klavier spielen lernen.'],
['🎓','1862','Peter ist jetzt 22 Jahre alt. In Sankt Petersburg beginnt er sein Musikstudium. Musik wird sein Beruf.'],
['🏫','1866','Peter zieht nach Moskau. Dort unterrichtet er an der Musikschule. Er ist jetzt Lehrer und schreibt nebenbei eigene Musik.'],
['🎄','1892','Das Ballett Der Nussknacker wird zum ersten Mal aufgeführt. Das ist kurz vor Weihnachten, am 18. Dezember in Sankt Petersburg.']];
const V={
home:card(PT,'Hallo, ich bin Peter!','Ich habe wunderschöne Musik geschrieben, zum Beispiel für Weihnachten. Wähle aus, was du entdecken möchtest.')+
`<nav class="menu"><button data-go="leben" style="background:var(--r)"><span>🎼</span><div>Tschaikowskys Leben<small>Wann und wo er gelebt hat</small></div></button>
<button data-go="stuecke" style="background:var(--g)"><span>🦢</span><div>Bekannteste Stücke<small>Mit Hörproben</small></div></button>
<button data-go="suite" style="background:#c8891a"><span>🍬</span><div>Die Nussknackersuite<small>Tänze aus dem Ballett</small></div></button></nav>`,
leben:card(PT,'Das ist Peter','Vollständiger Name: Pjotr Iljitsch Tschaikowsky. In Deutschland sagt man oft Peter. Geboren am 7. Mai 1840 in Wotkinsk in Russland. Gestorben am 6. November 1893 in Sankt Petersburg.')+L.map(a=>card(...a)).join(''),
stuecke:card('🦢','Schwanensee','Schwanensee ist ein Ballett. Die Prinzessin Odette wurde in einen Schwan verzaubert. Prinz Siegfried verliebt sich in sie. Das Ballett wurde 1877 in Moskau zum ersten Mal gezeigt.',pl('schwanensee','Hörprobe Schwanensee'))+
card('🥜','Der Nussknacker','Zu Weihnachten bekommt das Mädchen Clara einen Nussknacker geschenkt. In der Nacht wird er lebendig und kämpft gegen den Mäusekönig. Danach reisen beide ins Land der Süßigkeiten.',pl('nussknacker','Hörprobe Nussknacker')),
suite:card('🎁','Was ist eine Suite?','Das Ballett Der Nussknacker ist sehr lang. Tschaikowsky suchte die schönsten Tänze aus. Daraus machte er die Nussknackersuite. Eine Suite ist eine Reihe von kurzen Musikstücken. Man hört sie im Konzert, auch ohne Tanz.')+
card('🍬','Die acht Stücke','Kleine Ouvertüre, Marsch, Tanz der Zuckerfee, Russischer Tanz, Arabischer Tanz, Chinesischer Tanz, Tanz der Rohrflöten und Blumenwalzer.',pl('zuckerfee','Tanz der Zuckerfee')+pl('blumenwalzer','Blumenwalzer'))+
card('🔔','Wusstest du das?','Im Tanz der Zuckerfee klingt ein besonderes Instrument: die Celesta. Sie klingt wie kleine Glöckchen. Tschaikowsky brachte sie extra aus Paris mit.')};
function go(v){S.cancel();cur&&cur.pause();$('#m').innerHTML=V[v];$('#back').hidden=v=='home';scrollTo(0,0)}
function say(t){if(S.speaking){S.cancel();return}const u=new SpeechSynthesisUtterance(t.replace(/[\u{1F000}-\u{1FFFF}\u2600-\u27BF▶]/gu,''));u.lang='de-DE';u.rate=.85;S.speak(u)}
let cur,tm;function toast(x){const t=$('#t');t.textContent=x;t.hidden=false;clearTimeout(tm);tm=setTimeout(()=>t.hidden=true,4000)}
function play(f){S.cancel();if(cur){cur.pause()}const a=cur=new Audio('audio/'+f+'.mp3');a.onerror=()=>toast('Die Musikdatei fehlt noch. Bitte einen Erwachsenen um Hilfe.');a.play().catch(()=>{})}
document.onclick=e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.go)go(b.dataset.go);
else if(b.dataset.f)play(b.dataset.f);
else if(b.classList.contains('snd')){const c=b.closest('.c');say(c.querySelector('h3').textContent+'. '+c.querySelector('p').textContent)}};
for(let i=0;i<22;i++){const s=document.createElement('span');s.textContent='❄';s.style.cssText=`left:${Math.random()*100}%;font-size:${14+Math.random()*16}px;animation-duration:${8+Math.random()*10}s;animation-delay:-${Math.random()*14}s`;$('#snow').append(s)}
go('home');
</script></body></html>
